<!doctype html>
<!-- SPDX-License-Identifier: AGPL-3.0-only -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oscillux web host</title>
<style>
  :root { color-scheme: dark; font: 13px/1.4 system-ui, sans-serif; }
  html, body { margin: 0; height: 100%; background: #000; color: #ddd; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #bar { position: fixed; left: 12px; right: 12px; bottom: 12px; display: flex; flex-wrap: wrap; gap: 8px;
         align-items: center; padding: 8px 10px; background: rgb(0 0 0 / .55); border-radius: 8px; }
  #bar select, #bar button, #bar label { font: inherit; color: inherit; background: rgb(255 255 255 / .1);
         border: 1px solid rgb(255 255 255 / .2); border-radius: 6px; padding: 4px 8px; }
  #title { flex: 1 1 240px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: .8; }
  #status { font-variant-numeric: tabular-nums; opacity: .7; }
  #err { position: fixed; top: 12px; left: 12px; right: 12px; white-space: pre-wrap; color: #f88; font: 12px ui-monospace, monospace; }
  input[type=file] { display: none; }
  /* Overlay regions (overlay.js): the present pass holds the visual under each marked element
     at or below the light-text ceiling, or at or above the dark-text floor. */
  #caption { position: fixed; top: 16px; left: 16px; max-width: min(60vw, calc(100vw - 280px)); padding: 6px 10px; border-radius: 6px;
             font-size: 22px; font-weight: 600; color: #fff; pointer-events: none; }
  #caption small { display: block; font-size: 13px; font-weight: 400; }
  #badge { position: fixed; top: 16px; right: 16px; padding: 4px 10px; border-radius: 12px;
           font-weight: 600; color: #000; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="err"></div>
<div id="caption" data-overlay="light-text desaturate damp-motion damp-flash" data-overlay-feather="12">
  <span id="caption-title"></span><small>Text over the visual, held at 4.5:1 against white</small>
</div>
<div id="badge" data-overlay="dark-text damp-flash">Dark text, 4.5:1 against black</div>
<div id="bar" data-overlay="light-text desaturate blur damp-motion damp-flash">
  <select id="collection" aria-label="Collection" title="Show only a curated collection, with its own switch transitions"></select>
  <select id="type" aria-label="Type" title="Show only visuals of this type"></select>
  <select id="intensity" aria-label="Intensity" title="Show only visuals of this intensity"></select>
  <button id="prev" title="Previous visual">◀</button>
  <select id="pick" aria-label="Visual"></select>
  <button id="next" title="Next visual">▶</button>
  <button id="pause">Pause</button>
  <button id="restart">Restart</button>
  <select id="trans" aria-label="Transition" title="Switch transition"><option value="auto">auto</option></select>
  <button id="colour" title="Palette tour and saturation, or the manifest palette">Vivid</button>
  <label>Image…<input id="img" type="file" accept="image/*"></label>
  <label title="Play an audio file through the Oscillux DSP">Audio…<input id="audio" type="file" accept="audio/*"></label>
  <label title="CD+G lyrics (.cdg) over the visual, in time with the audio, or an MP3+G .zip with its song; or drop a song and its .cdg together, or the .zip">Lyrics…<input id="cdg" type="file" accept=".cdg,.zip"></label>
  <button id="mic" title="Analyse the microphone (not played back)">Mic</button>
  <button id="synth" title="Back to the synthetic signal">Synthetic</button>
  <span id="title"></span>
  <span id="status"></span>
</div>
<script type="module" src="host.js"></script>
</body>
</html>
